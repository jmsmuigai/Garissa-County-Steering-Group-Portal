name: Live flood situation update

# Every 3 hours (and on demand) fetch rain, River Tana (GloFAS) and NASA MODIS flood data,
# recompute the CSG alert and publish docs/data/live/situation.json to GitHub Pages.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy httpx shapely pillow
      - name: Refresh live situation
        run: python scripts/update_live.py
      - name: Publish if changed
        run: |
          git config user.name "csg-live-bot"
          git config user.email "csg-live-bot@users.noreply.github.com"
          git add frontend/public/data/live docs/data/live
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Live situation update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
